<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GHOST Phase 4 - Phantom Call Engine 🍋</title>
      <link rel="stylesheet" href="css/style.css">

      <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <h1>👻 Phantom Call Engine</h1>
        <p class="subtitle">緊急コール偽装プロトコル - THE GHOST Phase 4</p>

        <!-- プリセット選択 -->
        <div class="section">
            <div class="section-title">📱 着信プリセット</div>
            <div class="preset-grid">
                <button class="preset-btn active" data-preset="teams">
                    💼 Teams
                </button>
                <button class="preset-btn" data-preset="slack">
                    💬 Slack
                </button>
                <button class="preset-btn" data-preset="legacy">
                    ☎️ Legacy
                </button>
                <button class="preset-btn" data-preset="alert">
                    🚨 Alert
                </button>
            </div>
        </div>

        <!-- 発信元設定 -->
        <div class="section">
            <div class="section-title">🎭 発信元カスタマイズ</div>
            <label class="label">発信元名</label>
            <input type="text" id="callerNameInput" class="input-field" 
                   placeholder="例: AWS CloudWatch Alert">
        </div>

        <!-- 遅延タイマー -->
        <div class="section">
            <div class="section-title">⏰ 着信タイミング</div>
            <label class="label">遅延秒数</label>
            <input type="range" id="delaySlider" min="0" max="600" step="5" value="0">
            <div class="slider-value"><span id="delayValue">即時</span></div>
        </div>

        <!-- 音量・マナーモード -->
        <div class="section">
            <div class="section-title">🔊 音響設定</div>
            <label class="label">音量レベル</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
            
            <div style="margin-top: 16px;">
                <label class="label">マナーモード（バイブ・画面点滅のみ）</label>
                <div class="toggle-group">
                    <div class="toggle" id="muteToggle">
                        <div class="toggle-knob"></div>
                    </div>
                    <span style="font-size: 12px; color: #666;">OFF</span>
                </div>
            </div>
        </div>

        <!-- トリガーボタン -->
        <div class="section">
            <div class="section-title">🚀 着信発火</div>
            <div class="trigger-buttons">
                <button class="btn btn-primary" id="triggerNowBtn">
                    即座に着信
                </button>
                <button class="btn btn-primary" id="triggerScheduleBtn">
                    スケジュール着信
                </button>
            </div>
            <div class="hotkey-hint">
                💡 ホットキー: Ctrl + Shift + X で即座着信
            </div>
        </div>

        <!-- QRコード生成 -->
        <div class="section">
            <div class="section-title">📲 モバイルリモート</div>
            <button class="btn btn-secondary" id="generateQrBtn" style="width: 100%;">
                QRコード生成 (スマホ連携)
            </button>
            <div id="qrDisplay" class="qr-display">
                <div class="qr-label">スマートフォンで読み込んでください</div>
            </div>
        </div>

        <!-- 情報 -->
        <div class="info-box">
            ⚠️ <strong>緊急中止:</strong> 着信・通話中に ESC キーを 2 回押すと中止できます。
        </div>
    </div>

    <!-- 着信オーバーレイ -->
    <div id="incomingCallOverlay" class="incoming-call-overlay">
        <div class="incoming-call-card teams">
            <div class="pulse-icon">💼</div>
            <div class="caller-name">System Monitoring</div>
            <div class="caller-detail">Incoming call</div>
            <div class="call-actions">
                <button class="call-btn accept" id="acceptBtn">
                    ✓
                </button>
                <button class="call-btn reject" id="rejectBtn">
                    ✕
                </button>
            </div>
        </div>
    </div>

    <!-- 通話画面オーバーレイ -->
    <div id="callScreenOverlay" class="call-screen-overlay">
        <div class="call-header">
            <div class="call-timer" id="callTimer">00:00</div>
            <div class="call-status">通話中...</div>
        </div>

        <div class="prompter-area">
            <div class="prompter-text" id="prompterText">
                待機中…
            </div>
        </div>

        <div class="call-footer">
            <button class="call-btn-mute" id="muteCallBtn" title="ミュート">
                🔇
            </button>
            <button class="call-btn-end" id="endCallBtn" title="終了">
                📞
            </button>
        </div>
    </div>
</body>
</html>
